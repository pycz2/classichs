[package]
name = "classichs-bots"
version = "0.1.0"
edition = "2021"
description = "Bots that play Classic on a Classic HS game server (its WebSocket protocol), with a local admin page"

[dependencies]
axum = "0.8.9"
classichs-engine = { path = "../rust/engine" }
futures-util = "0.3.34"
rand = "0.8"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true

# the bots think with the rules engine: slow without optimisation, also in tests
[profile.dev.package.classichs-engine]
opt-level = 3
[profile.dev.package.classichs-script]
opt-level = 3
