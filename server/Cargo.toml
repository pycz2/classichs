[package]
name = "classichs-server"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
classichs-engine = { path = "../rust/engine" }
classichs-brain = { path = "../rust/brain", features = ["names"] }
futures-util = "0.3.34"
object_store = { version = "0.14", features = ["aws", "fs"] }
rand = "0.8"
# the bots' network adapter (wss:// needs one rustls crypto provider)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rpassword = "7.5.4"
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-json", "sqlx-sqlite", "runtime-tokio", "sqlite-use-returning-for-3_35"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# The rules engine is slow unoptimized (the tests play whole games with its bot).
[profile.release]
strip = true  # the released server binaries ship without debug symbols (28.8 → 22.2 MB on Linux)

[profile.dev.package.classichs-engine]
opt-level = 2

[profile.dev.package.classichs-brain]
opt-level = 2
