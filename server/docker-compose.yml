# The game server with an S3-compatible pack store (SeaweedFS, `weed mini`).
#   tools/build_packs.sh && cd server && docker compose up -d --build
# The image bundles packs/*.cardpack (Neonfall, the default game, and Classic).
# Game: ws://localhost:7377 · admin panel: http://localhost:7377/admin
# The superuser: docker compose exec server classichs-server admin root --db /data/classichs.db
# Change S3_ACCESS_KEY / S3_SECRET_KEY (in .env next to this file) for anything but a test.

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    # One process: master, volume, filer and the S3 gateway; creates the bucket at start.
    command: ["mini", "-dir=/data", "-bucket=packs", "-admin.ui=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-classichs}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-please}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: classichs-server
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: packs
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-classichs}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-please}
      RUST_LOG: info
    ports:
      - "7377:7377"
    volumes:
      - server-data:/data
      # More bundled packs (each becomes a server pack once), e.g.:
      # - ./my-game.cardpack:/packs/my-game.cardpack:ro
    restart: unless-stopped

volumes:
  s3-data:
  server-data:
