# Builds the game for every platform on each push to main (a check) and, on a
# version tag vX.Y.Z, publishes a GitHub release with the builds:
#   Web (zip), Windows (.exe), Linux (.AppImage), macOS (.zip with the app), Android (.apk).
# The rust job builds, per OS, the rules engine (rust/, tools/build_rules.sh: macOS universal
# on macOS, Windows on Windows, Linux + Android + WebAssembly on Linux) and the game server
# (server/) in one target directory, so the engine and the shared crates compile once; the
# crates are cached (Swatinem/rust-cache, saved from main only). The game job takes the
# libraries, tests and exports everything. A version tag runs no tests: they passed on main.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  rust:
    strategy:
      matrix:
        include:
          - os: macos-14
            platforms: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            server: macos-arm64
            bin: classichs-server
          - os: windows-2022
            platforms: windows
            targets: ""
            server: windows-x86_64
            bin: classichs-server.exe
          - os: ubuntu-24.04
            platforms: linux android web
            targets: aarch64-linux-android,wasm32-unknown-unknown
            server: linux-x86_64
            bin: classichs-server
    runs-on: ${{ matrix.os }}
    env:
      # the rules engine and the server share it: the engine and the common crates build once
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> ../target
            server -> ../target
          key: ${{ matrix.os }}
          # a tag's cache is seen by no other run: save from main only (tags read main's)
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Engine tests
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/')
        run: cd rust && cargo test --release -p classichs-engine
      - name: Build the rules engine
        shell: bash
        run: tools/build_rules.sh ${{ matrix.platforms }}
      - uses: actions/upload-artifact@v7
        with:
          name: rules-${{ runner.os }}
          path: rules/bin/*
          if-no-files-found: error
      - name: Server tests
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: cd server && cargo test --release
      - name: Build the server
        shell: bash
        run: |
          cd server && cargo build --release
          ver=$(sed -n 's/^config\/version="\(.*\)"/\1/p' ../project.godot)
          mkdir -p ../build/server
          ext=$([ "${{ runner.os }}" = Windows ] && echo .exe || echo "")
          cp "$CARGO_TARGET_DIR/release/${{ matrix.bin }}" "../build/server/ClassicHS-server-$ver-${{ matrix.server }}$ext"
          chmod +x ../build/server/ClassicHS-server-*
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.server }}
          path: build/server/ClassicHS-server-*
          if-no-files-found: error

  game:
    needs: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rules-*
          path: rules/bin
          merge-multiple: true

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz

      - name: Install Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r ~/godot/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          sudo ln -sf ~/godot/godot /usr/local/bin/godot
          godot --version

      - name: Install appimagetool
        run: |
          curl -sSfL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec /tmp/appimagetool "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # A release keystore from the repository secrets when there is one; else a
          # throwaway one (the APK then has to be reinstalled on each update).
          user=""
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/release.keystore
            user=$(printf %s "$KEYSTORE_USER" | tr -d '\r\n'); pass=$(printf %s "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            echo "::add-mask::$pass"
            # Godot uses one password for the store and the key: check both, through the private key
            if ! keytool -certreq -keystore ~/release.keystore -storepass "$pass" -keypass "$pass" -alias "$user" -file /dev/null >/dev/null 2>&1; then
              # the secrets do not open the keystore (wrong alias, password or file): say so, and still build
              echo "::warning title=Android signing::ANDROID_KEYSTORE_* secrets do not open the keystore (check the alias in ANDROID_KEYSTORE_USER, the password — the key password must equal the store password —, and that ANDROID_KEYSTORE_BASE64 is the whole file); this build uses a throwaway key"
              user=""
            fi
          fi
          if [ -z "$user" ]; then
            rm -f ~/release.keystore
            user=classichs; pass=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore ~/release.keystore -alias "$user" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Classic HS" >/dev/null
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user" >> "$GITHUB_ENV"
          echo "::add-mask::$pass"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"
          for v in 4 4.7; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-$v.tres
          done

      - name: Import and test
        run: |
          godot --headless --path . --import >/dev/null 2>&1 || true
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then echo "a tag: the tests passed on main"; exit 0; fi
          ./run_tests.sh 2>&1 | tee /tmp/tests.log | tail -5
          grep -q " 0 failed" /tmp/tests.log

      - name: Export every platform
        # one platform at a time; a failure shows the end of its log as an annotation (readable without login)
        run: |
          fail=0
          for p in web windows linux macos android; do
            if ! RULES_PREBUILT=1 tools/export_all.sh "$p" > "/tmp/export_$p.log" 2>&1; then
              fail=1
              echo "::error title=Export $p failed::$(grep -v '^\s*$' "/tmp/export_$p.log" | tail -n 25 | tr '\n' '|' | tr -d '%' | cut -c1-6000)"
            fi
          done
          ls -l build/release
          exit $fail

      - uses: actions/upload-artifact@v7
        with:
          name: game
          path: build/release/ClassicHS-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [game, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: game
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          name: Classic HS ${{ github.ref_name }}
          body: |
            Builds of ${{ github.ref_name }}. Changes: see CHANGELOG.md (data/changelog/<lang>.md for other languages).
            - Web: unzip and serve the folder over HTTP, or play at https://pycz2.github.io/classichs/
            - Windows: unzip ClassicHS-*-windows-x86_64.zip and run ClassicHS.exe (keep the .dll next to it)
            - Linux: ClassicHS-*-linux-x86_64.AppImage (chmod +x, then run)
            - macOS: unzip ClassicHS-*-macos.zip; the app is not notarized: right-click → Open the first time
            - Android: ClassicHS-*-android-arm64.apk (allow installing from this source)
            - Game server: ClassicHS-server-* for Linux, Windows, macOS (see server/README.md); put ClassicHS-*-classic.cardpack and ClassicHS-*-neon.cardpack into a folder and pass it as --packs-dir
          files: dist/*
