# Builds the game for every platform on each push to main (a check: the tests and every build) and, on a
# version tag vX.Y.Z, publishes a GitHub release from the files of main's run of the same commit (the tag
# builds nothing again; tools/release.sh tags a commit only after its run on main passed):
#   Web (zip), Windows (.exe), Linux (.AppImage), macOS (.zip with the app), Android (.apk), the game packs, the
#   admin panel's replay player (ClassicHS-x.y.z-replay-viewer.zip), the game servers and the Linux server's
#   Docker image (ClassicHS-x.y.z-server-image.tar.gz: tools/deploy_server.sh has the host download it).
# A run on main keeps the artifacts server-linux-x86_64 and replay-viewer: tools/deploy_server.sh --from-ci deploys them.
# Jobs: rust-linux (the engine's and the server's tests; the rules engine for Linux, Android and the web; the Linux
# server), rust (macOS and Windows: their rules engine and server, no tests: the server runs on Linux), test (the
# game's tests, as soon as rust-linux is done), export (every platform, after all the rust jobs). The Rust caches
# are keyed by the toolchain too (cargo rebuilds everything for another rustc, and an exact key match never saved a
# new cache: 2026-11-12 … 11-20 every run built from scratch), saved from main only.
# Commits that change only docs/ start no run.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**"]  # (not applied to tags)
  workflow_dispatch:

permissions:
  contents: write
  actions: read  # the tag's release job downloads the artifacts of main's run

env:
  GODOT_VERSION: "4.7.2"

jobs:
  rust-linux:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    env:
      # the rules engine and the server share it: the engine and the common crates build once
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - name: Restore the Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-ubuntu-24.04-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rust/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: rust-ubuntu-24.04-${{ steps.toolchain.outputs.cachekey }}-
      - name: Engine tests
        run: cd rust && cargo test --release -p classichs-engine
      - name: Build the rules engine
        run: tools/build_rules.sh linux android web
      - uses: actions/upload-artifact@v7
        with:
          name: rules-Linux
          path: rules/bin/*
          if-no-files-found: error
      - name: Server tests
        run: cd server && cargo test --release
      - name: Build the server
        run: |
          cd server && cargo build --release
          ver=$(sed -n 's/^config\/version="\(.*\)"/\1/p' ../project.godot)
          mkdir -p ../build/server
          cp "$CARGO_TARGET_DIR/release/classichs-server" "../build/server/ClassicHS-server-$ver-linux-x86_64"
          chmod +x ../build/server/ClassicHS-server-*
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux-x86_64
          path: build/server/ClassicHS-server-*
          if-no-files-found: error
      - name: Save the Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  rust:
    if: github.ref_type == 'branch'
    strategy:
      matrix:
        include:
          - os: macos-15
            platforms: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            server: macos-arm64
            bin: classichs-server
          - os: windows-2022
            platforms: windows
            targets: ""
            server: windows-x86_64
            bin: classichs-server.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Restore the Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ matrix.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rust/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Build the rules engine
        shell: bash
        run: tools/build_rules.sh ${{ matrix.platforms }}
      - uses: actions/upload-artifact@v7
        with:
          name: rules-${{ runner.os }}
          path: rules/bin/*
          if-no-files-found: error
      # no server tests here: the server runs on Linux and rust-linux tests it; this build shows a compile error
      - name: Build the server
        shell: bash
        run: |
          cd server && cargo build --release
          ver=$(sed -n 's/^config\/version="\(.*\)"/\1/p' ../project.godot)
          mkdir -p ../build/server
          ext=$([ "${{ runner.os }}" = Windows ] && echo .exe || echo "")
          cp "$CARGO_TARGET_DIR/release/${{ matrix.bin }}" "../build/server/ClassicHS-server-$ver-${{ matrix.server }}$ext"
          chmod +x ../build/server/ClassicHS-server-*
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.server }}
          path: build/server/ClassicHS-server-*
          if-no-files-found: error
      - name: Save the Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  # The game's tests need only the Linux rules engine: they run while macOS and Windows still build.
  test:
    needs: rust-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rules-Linux
          path: rules/bin
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot-editor
          key: godot-editor-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-editor && cd ~/godot-editor
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
      - name: Install Godot
        run: sudo ln -sf ~/godot-editor/godot /usr/local/bin/godot && godot --version
      # each test file's time in the last run on main: the processes get equal shares by time (tools/run_tests.py)
      - name: Restore the test times
        uses: actions/cache/restore@v6
        with:
          path: build/test_times.json
          key: test-times-${{ github.run_id }}
          restore-keys: test-times-
      - name: Import and test
        env:
          TEST_JOBS: "4"  # the runner has 4 cores
        run: |
          godot --headless --path . --import >/dev/null 2>&1 || true
          ./run_tests.sh 2>&1 | tee /tmp/tests.log | tail -5
          grep -q " 0 failed" /tmp/tests.log
      - name: Save the test times
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: build/test_times.json
          key: test-times-${{ github.run_id }}

  export:
    needs: [rust-linux, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rules-*
          path: rules/bin
          merge-multiple: true

      # only the export templates the presets use (about 0.4 GB of 1.9 GB)
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-used-templates

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          cd templates
          keep="version.txt icudt_godot.dat web_nothreads_release.zip windows_release_x86_64.exe windows_release_x86_64_console.exe linux_release.x86_64 macos.zip android_release.apk"
          for f in *; do case " $keep " in *" $f "*) ;; *) rm -rf "$f" ;; esac; done
          ls -l

      - name: Install Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r ~/godot/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          sudo ln -sf ~/godot/godot /usr/local/bin/godot
          godot --version

      - name: Install appimagetool
        run: |
          curl -sSfL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec /tmp/appimagetool "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # the runner's own Android SDK (ANDROID_HOME) has the build tools: nothing to download
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME; build tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
          ls "$ANDROID_HOME/build-tools" | grep -q . || { echo "::error::no Android build tools on the runner"; exit 1; }

      - name: Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # A release keystore from the repository secrets when there is one; else a
          # throwaway one (the APK then has to be reinstalled on each update).
          user=""
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > ~/release.keystore
            user=$(printf %s "$KEYSTORE_USER" | tr -d '\r\n'); pass=$(printf %s "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            echo "::add-mask::$pass"
            # Godot uses one password for the store and the key: check both, through the private key
            if ! keytool -certreq -keystore ~/release.keystore -storepass "$pass" -keypass "$pass" -alias "$user" -file /dev/null >/dev/null 2>&1; then
              # the secrets do not open the keystore (wrong alias, password or file): say so, and still build
              echo "::warning title=Android signing::ANDROID_KEYSTORE_* secrets do not open the keystore (check the alias in ANDROID_KEYSTORE_USER, the password — the key password must equal the store password —, and that ANDROID_KEYSTORE_BASE64 is the whole file); this build uses a throwaway key"
              user=""
            fi
          fi
          if [ -z "$user" ]; then
            rm -f ~/release.keystore
            user=classichs; pass=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore ~/release.keystore -alias "$user" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Classic HS" >/dev/null
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user" >> "$GITHUB_ENV"
          echo "::add-mask::$pass"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass" >> "$GITHUB_ENV"
          for v in 4 4.7; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-$v.tres
          done

      # every platform in one call: the packs, WebRTC and the import are done once; each step prints its time
      - name: Export every platform
        run: |
          godot --headless --path . --import >/dev/null 2>&1 || true
          if ! RULES_PREBUILT=1 tools/export_all.sh > /tmp/export.log 2>&1; then
            echo "::error title=Export failed::$(grep -v '^\s*$' /tmp/export.log | tail -n 25 | tr '\n' '|' | tr -d '%' | cut -c1-6000)"
            tail -n 60 /tmp/export.log; exit 1
          fi
          grep -E '▶|✔' /tmp/export.log
          ls -l build/release

      # kept for the tag's release job (tools/release.sh tags a commit after this run); everything in it is
      # compressed already
      - uses: actions/upload-artifact@v7
        with:
          name: game
          path: build/release/ClassicHS-*
          if-no-files-found: error
          compression-level: 0

      # on its own too: tools/deploy_server.sh --from-ci takes it without the whole game (about 2 GB)
      - uses: actions/upload-artifact@v7
        with:
          name: replay-viewer
          path: build/release/ClassicHS-*-replay-viewer.zip
          if-no-files-found: error
          compression-level: 0

  # A tag builds nothing: the files come from main's passed run of the same commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Find main's run of this commit
        id: main-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w Release -b main -c "$GITHUB_SHA" -s success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || { echo "::error::no passed Release run on main for $GITHUB_SHA: push the commit to main and wait for its run (tools/release.sh does)"; exit 1; }
          echo "main's run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: game
          path: dist
          run-id: ${{ steps.main-run.outputs.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.main-run.outputs.id }}
          github-token: ${{ github.token }}
      # the Linux server's Docker image as tools/deploy_server.sh made it on the developer's machine before
      - name: The server's image
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir -p img/replay-viewer
          cp dist/ClassicHS-server-$ver-linux-x86_64 img/classichs-server && chmod 755 img/classichs-server
          unzip -q dist/ClassicHS-$ver-replay-viewer.zip -d img/replay-viewer
          cp deploy/docker-host/Dockerfile img/
          docker build -q --platform linux/amd64 -t "classichs-server:$ver" img >/dev/null
          docker save "classichs-server:$ver" | gzip -1 > "dist/ClassicHS-$ver-server-image.tar.gz"
      - name: List files
        run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          name: Classic Heroes Showdown ${{ github.ref_name }}
          body: |
            Builds of ${{ github.ref_name }}. Changes: see CHANGELOG.md (data/changelog/<lang>.md for other languages).
            - Web: unzip and serve the folder over HTTP, or play at https://pycz2.github.io/classichs/
            - Windows: unzip ClassicHS-*-windows-x86_64.zip and run ClassicHS.exe (keep the .dll next to it)
            - Linux: ClassicHS-*-linux-x86_64.AppImage (chmod +x, then run)
            - macOS: unzip ClassicHS-*-macos.zip; the app is not notarized: right-click → Open the first time
            - Android: ClassicHS-*-android-arm64.apk (allow installing from this source)
            - Replay player of the server's admin panel: ClassicHS-*-replay-viewer.zip (unzip into the folder of --replay-dir)
            - The Linux game server's Docker image: ClassicHS-*-server-image.tar.gz (docker load < it; tools/deploy_server.sh has the host download it)
            - Game server: ClassicHS-server-* for Linux, Windows, macOS (see server/README.md); put the ClassicHS-*-<pack>.cardpack files (classic, neon, naxx and the expansion packs, which the game's builds do not carry: install them from a server or as a file) into a folder and pass it as --packs-dir
          files: dist/*
