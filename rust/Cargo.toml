[workspace]
members = ["engine", "godot", "wasm", "script"]
resolver = "2"

[profile.release]
opt-level = 3
strip = true  # the game's GDExtension libraries ship without debug symbols

[profile.test]
opt-level = 2

# The browser's rules.wasm: small (tools/build_rules.sh web).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
