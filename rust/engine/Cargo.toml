[package]
name = "classichs-engine"
version = "0.1.0"
edition = "2021"
description = "Rules engine of Classic HS (Hearthstone Classic, June 2014): one JSON API for the server, Godot (GDExtension) and the browser (WASM)."
license = "MIT"

[lib]
name = "classichs_engine"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
classichs-script = { path = "../script" }
# inflate for .cardpack (zip) files; pure Rust, builds for wasm32 and Android
miniz_oxide = "0.9"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
