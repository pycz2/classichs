[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json, data/i18n/*.json, CHANGELOG.md, data/changelog/*.md, art/cards/*.jpg"
exclude_filter="art/original/*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
html/export_icon=true
html/canvas_resize_policy=2
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://icons/icon_144.png"
progressive_web_app/icon_180x180="res://icons/icon_180.png"
progressive_web_app/icon_512x512="res://icons/icon_512.png"
progressive_web_app/background_color=Color(0.105882, 0.0784314, 0.0588235, 1)
