# Copy to secret.yaml, fill in, `kubectl apply -f secret.yaml` (keep it out of git).
# Without this secret the server keeps the pack files in /data/store on its volume.
apiVersion: v1
kind: Secret
metadata:
  name: classichs-s3
type: Opaque
stringData:
  S3_BUCKET: packs
  S3_ENDPOINT: http://seaweedfs:8333   # in-cluster SeaweedFS (seaweedfs.yaml); empty = AWS S3
  S3_REGION: us-east-1
  S3_ACCESS_KEY: change-me
  S3_SECRET_KEY: change-me-too
