# Optional: an in-cluster S3 store for the pack files (as server/docker-compose.yml).
# Skip it with an external S3 (AWS, R2, B2, MinIO…): point S3_ENDPOINT in the secret there.
# `weed mini` = master, volume, filer and the S3 gateway in one process; it creates the
# bucket at start and takes its credentials from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels: {app: seaweedfs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.48
          args: [mini, -dir=/data, -bucket=packs, -admin.ui=false]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: classichs-s3, key: S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: classichs-s3, key: S3_SECRET_KEY}}
          ports:
            - {name: s3, containerPort: 8333}
          resources:                  # measured idle: ~210 MiB, ~1 % of a core
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: s3}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: s3}
